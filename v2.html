<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V2 — Center calm, vertical columns</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V2 (reworked): differentiated from Control. Instead of full-bleed tilted rows, the
     wall is now VERTICAL COLUMNS that drift up/down (adjacent columns opposite ways),
     with SMALLER tiles so more merchant photos show at better quality. The signup stays
     centered, and the only darkening is a soft feathered pool behind it. */
  :root{ --gap: clamp(8px,0.9vw,14px); --radius-tile:14px; }
  body{ background:#0b0b0c; }
  .hero{ position:relative; width:100%; aspect-ratio:1440/810; max-height:100svh; overflow:hidden; background:#c7cdd2; isolation:isolate; }
  .bed{ position:absolute; inset:0; --gap:clamp(8px,0.9vw,14px); }
  /* Darkening, like Control: a flat tint across the whole wall so the images read a bit
     darker overall, PLUS a deeper feathered pool around the centre signup for legibility. */
  .scrim{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(42% 48% at 50% 50%,
        rgba(0,0,0,.62) 0%, rgba(0,0,0,.46) 34%, rgba(0,0,0,.22) 58%, rgba(0,0,0,0) 80%),
      linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.30));
  }
  .logo{ position:absolute; top:max(14px,2.2vh); left:50%; transform:translateX(-50%); z-index:3; line-height:0; }
  /* Larger, dark (black-wordmark) logo so it reads prominently over the columns. */
  .logo .logo-vid{ height:clamp(64px,7vw,96px); filter:drop-shadow(0 2px 10px rgba(0,0,0,.35)); }
  .content{
    position:absolute; z-index:3; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(500px, 88vw); display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center;
  }
  .content .intro{ width:100%; border-radius:30px; padding:34px 30px 30px; }
  .content .intro h1{ font-size:clamp(32px,4.4vw,46px); }
  .content .cta{ width:100%; text-align:left; }
  @media (max-width: 900px){
    .hero{ aspect-ratio:auto; height:100svh; min-height:600px; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="bed" id="bed" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo-dark.webm" type="video/webm" />
        <source src="assets/logo-dark.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-dark.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
    Mosaic.buildColumns(document.getElementById('bed'), { colTargetW: 200, eagerFirst:5, durBase:74 });
    Mosaic.perfPanel();
  </script>
</body>
</html>
