<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V2 — Centered signup, calm bed</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V2: same drifting mosaic, but pushed back — desaturated, softly blurred and slowed —
     so it reads as ambient texture while a single centered signup column carries all focus.
     A darker centre pool deepens the contrast behind the card. */
  body{ background:#0b0b0c; }
  .hero{ position:relative; width:100%; aspect-ratio:1440/810; max-height:100svh; overflow:hidden; background:#1c2024; isolation:isolate; }
  .rotor{ filter:saturate(.82) brightness(.9) blur(2px); transform:translate(-50%,-50%) rotate(var(--tilt,18deg)) scale(1.06); }
  .scrim{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(58% 64% at 50% 50%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.30) 45%, rgba(0,0,0,0) 78%),
      radial-gradient(140% 120% at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,.5) 100%),
      linear-gradient(rgba(8,10,12,.42), rgba(8,10,12,.42));
  }
  .logo{ position:absolute; top:max(14px,2.2vh); left:50%; transform:translateX(-50%); z-index:3; line-height:0; }
  .content{
    position:absolute; z-index:3; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(500px, 88vw); display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center;
  }
  .content .intro{ width:100%; border-radius:30px; padding:34px 30px 30px; }
  .content .intro h1{ font-size:clamp(32px,4.4vw,46px); }
  .content .cta{ width:100%; text-align:left; }
  .content .trust{ justify-content:center; margin-top:4px; }
  @media (max-width: 900px){
    .hero{ aspect-ratio:auto; height:100svh; min-height:600px; }
    :root{ --th: clamp(190px, 44vw, 300px); }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="rotor" aria-hidden="true"><div class="track"></div></div>
    <div class="scrim" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo.webm" type="video/webm" />
        <source src="assets/logo.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-fallback.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
      <div class="trust on-dark"><span class="lbl">Trusted by</span><span class="names">Allbirds · Clek · Leesa · UNTUCKit</span></div>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
    Mosaic.build(document.querySelector('.rotor'), { eagerFirst:3, halfMul:1.3, durBase:104 });
    Mosaic.perfPanel();
  </script>
</body>
</html>
