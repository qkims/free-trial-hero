<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V4 — Living mood wall</title>
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V4 (round 4): a "mood wall" of merchant tiles — no marquee, no sliding.
     The wall is built in JS as MASONRY: a few equal-width columns, each packed
     top-to-bottom with tiles of VARIED heights (landscape / square / portrait), so
     sizes feel diverse while every column still fills to the bottom (no gaps).
     Each tile periodically MORPHS to a new photo with a zoom-dissolve. On hover the
     wall does a snappy 3D parallax tilt. The wall's left edge is FEATHER-MASKED and a
     soft pool sits behind the signup, so tiles never bleed into the signup zone.
     LCP is the heading text. */
  :root{ --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif; --rt:16px; }
  body{ background:#04110f; }
  .hero{
    position:relative; width:100%; height:100svh; min-height:620px; max-height:940px; overflow:hidden;
    background:
      radial-gradient(120% 90% at 14% 22%, #0c3b32 0%, rgba(12,59,50,0) 55%),
      radial-gradient(120% 100% at 92% 84%, #0a2c4d 0%, rgba(10,44,77,0) 52%),
      linear-gradient(160deg, #04110f 0%, #061a17 58%, #03252c 100%);
    isolation:isolate; perspective:1500px;
  }

  /* The wall lives on the right; JS lays out masonry columns of varied-height tiles.
     Its left edge feathers to transparent so tiles dissolve into the bg before the
     signup, instead of hard-cutting against it. */
  .wall{
    position:absolute; top:-5%; bottom:-5%; right:-3%; width:62%;
    display:flex; align-items:flex-start; gap:10px; z-index:0;
    transform-style:preserve-3d; transform:rotateX(0) rotateY(0);
    transition:transform .12s ease-out; will-change:transform;
    -webkit-mask:linear-gradient(90deg, transparent 3%, rgba(0,0,0,.35) 16%, #000 30%, #000 100%);
            mask:linear-gradient(90deg, transparent 3%, rgba(0,0,0,.35) 16%, #000 30%, #000 100%);
  }
  .col{ display:flex; flex-direction:column; gap:10px; flex:1 1 0; min-width:0; }
  .cell{ position:relative; flex:0 0 auto; border-radius:var(--rt); overflow:hidden; background:#0c1c1a;
    box-shadow:0 20px 46px -30px rgba(0,0,0,.8);
    transition:height 1.6s cubic-bezier(.32,.06,.2,1); will-change:height; }
  /* Morph: a hidden tile sits zoomed-in; on .show it dissolves in and settles to scale 1,
     while the outgoing tile fades + zooms slightly further — a gentle cross-zoom, clipped
     inside the cell so nothing scales into its neighbours. */
  .cell img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transform:scale(1.09); transform-origin:50% 50%;
    transition:opacity 1.25s ease, transform 1.5s cubic-bezier(.2,.6,.2,1); }
  .cell img.show{ opacity:1; transform:scale(1); }

  /* Feathered veil: a left wash + a soft pool behind the signup so it always reads clean. */
  .veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(48% 66% at 24% 50%, rgba(4,17,15,.9) 0%, rgba(4,17,15,.5) 42%, rgba(4,17,15,0) 74%),
      linear-gradient(90deg, #04110f 22%, rgba(4,17,15,.6) 40%, rgba(4,17,15,0) 62%); }

  .logo{ position:absolute; top:max(18px,2.6vh); left:clamp(24px,5vw,72px); z-index:3; line-height:0; }
  .content{
    position:absolute; z-index:3; left:clamp(24px,5vw,72px); top:50%; transform:translateY(-50%);
    width:min(500px, 86vw); display:flex; flex-direction:column; gap:14px;
  }
  .content .intro.bare h1{ font-size:clamp(38px,5vw,60px); }
  .content .cta{ width:min(460px,100%); margin-top:6px; }

  @media (max-width: 900px){
    .hero{ display:flex; flex-direction:column; perspective:none; }
    /* Signup leads on mobile; the wall sits below as a bounded masonry band (no mask needed). */
    .content{ position:static; transform:none; order:1; width:auto;
      margin:clamp(78px,12vh,120px) clamp(20px,5vw,32px) 0; }
    .content .intro.bare h1{ font-size:clamp(34px,9vw,46px); }
    .content .cta{ width:100%; }
    .wall{ position:static; order:2; width:auto; right:auto; top:auto; bottom:auto;
      height:clamp(280px,44svh,460px);
      margin:clamp(20px,4vh,32px) clamp(14px,4vw,24px) clamp(16px,3vh,26px);
      transform:none; transition:none; -webkit-mask:none; mask:none; }
    .veil{ background:linear-gradient(0deg, rgba(4,17,15,0) 78%, rgba(4,17,15,.35) 100%); }
  }
  @media (prefers-reduced-motion: reduce){ .wall,.cell{ transition:none; } .cell img{ transition:opacity .4s ease; transform:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="wall" id="wall" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo.webm" type="video/webm" />
        <source src="assets/logo.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-fallback.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro bare on-dark">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b style="color:#fff">$1/month for 3 months.</b> What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    // Deterministically-shuffled deck; cells pull from it and morph between photos.
    var TILES = Mosaic.ALL.slice();
    var seed = 23; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var wall = document.getElementById('wall');
    var GAP = 10;
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // New height on a swap: a wide band around the cell's base, biased to grow, so the
    // boxes scale up dramatically. Re-randomised from base each time (not cumulative),
    // so it oscillates and the column total stays bounded (never drifts off).
    function morphH(cell){ return (cell._base * (0.8 + rnd()*0.7)).toFixed(1) + 'px'; }

    function scheduleSwap(cell, front, back, idx){
      var f = front, b = back;
      var period = 4200 + (idx % 7) * 760;             // staggered so cells don't flip in unison
      function swap(){
        b.onload = function(){
          b.classList.add('show'); f.classList.remove('show');
          var tmp = f; f = b; b = tmp;
          cell.style.height = morphH(cell);            // box scales as the new photo dissolves in
        };
        b.src = nextTile();
      }
      // First change comes quickly (~0.5–2.4s), then it settles into the longer cadence.
      setTimeout(function(){ swap(); setInterval(swap, period); }, 500 + (idx % 12) * 170);
    }

    function makeCell(colW, ar, idx){
      var cell = document.createElement('div'); cell.className = 'cell';
      cell._base = colW / ar;
      var a = new Image(), b = new Image();
      a.decoding = b.decoding = 'async'; a.alt = b.alt = '';
      if (idx < 7){ a.loading = 'eager'; a.fetchPriority = 'high'; } else { a.loading = 'lazy'; }
      b.loading = 'lazy';
      a.src = nextTile(); a.className = 'show';
      cell.appendChild(a); cell.appendChild(b);
      if (reduce){ cell.style.height = cell._base.toFixed(1) + 'px'; return cell; }
      // Intro: start a touch short, then immediately ease up to full height on open so
      // the wall visibly scales up the moment the page loads.
      cell.style.height = (cell._base * 0.82).toFixed(1) + 'px';
      setTimeout(function(){ cell.style.height = cell._base.toFixed(1) + 'px'; }, 40 + (idx % 16) * 40);
      scheduleSwap(cell, a, b, idx);
      return cell;
    }

    // Masonry: equal-width columns, each packed with VARIED-height tiles until it fills.
    function buildWall(){
      var W = wall.clientWidth, H = wall.clientHeight;
      if (!W || !H){ return; }
      var cols = Math.max(3, Math.round(W / 235));
      var colW = (W - GAP*(cols-1)) / cols;
      var aspects = [1.5, 1.0, 0.78, 1.22, 0.86, 1.0];   // landscape / square / portrait mix
      var idx = 0;
      for (var c = 0; c < cols; c++){
        var col = document.createElement('div'); col.className = 'col';
        var h = 0, safety = 0;
        // offset each column's aspect sequence so neighbours don't line up
        for (var s = 0; s < c; s++) rnd();
        while (h < H * 1.5 && safety++ < 100){
          var ar = aspects[Math.floor(rnd()*aspects.length)];
          var cell = makeCell(colW, ar, idx++);
          col.appendChild(cell);
          h += (colW / ar) + GAP;
        }
        wall.appendChild(col);
      }
    }
    buildWall();

    // Snappy 3D parallax tilt on hover (desktop, motion allowed); resets on leave.
    if (wall && !reduce && matchMedia('(min-width:901px)').matches){
      var hero = document.querySelector('.hero');
      hero.addEventListener('pointermove', function(e){
        var dx = (e.clientX / innerWidth - 0.5), dy = (e.clientY / innerHeight - 0.5);
        var ry = (-dx * 9).toFixed(2), rx = (dy * 7).toFixed(2);
        wall.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translate(' +
          (-dx*18).toFixed(1) + 'px,' + (-dy*13).toFixed(1) + 'px)';
      }, { passive:true });
      hero.addEventListener('pointerleave', function(){
        wall.style.transform = 'rotateX(0deg) rotateY(0deg) translate(0,0)';
      });
    }
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
