<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V4 — Living mood wall</title>
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V4 (reimagined): NOT a marquee. A fixed "mood wall" of merchant tiles that slowly
     CROSSFADE through the photo deck and gently breathe in place, with a subtle mouse
     parallax. A brand-gradient veil sweeps from the left so the signup stays crisp and
     dominant. Feels alive and editorial without anything sliding across the screen.
     Only a few tiles load eagerly → LCP is the heading text. */
  :root{ --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif; --rt:18px; }
  body{ background:#04110f; }
  .hero{
    position:relative; width:100%; height:100svh; min-height:620px; max-height:940px; overflow:hidden;
    background:
      radial-gradient(120% 90% at 14% 22%, #0c3b32 0%, rgba(12,59,50,0) 55%),
      radial-gradient(120% 100% at 92% 84%, #0a2c4d 0%, rgba(10,44,77,0) 52%),
      linear-gradient(160deg, #04110f 0%, #061a17 58%, #03252c 100%);
    isolation:isolate;
  }

  /* The wall lives on the right; a 4-col grid of breathing, crossfading cells. */
  .wall{
    position:absolute; top:-4%; bottom:-4%; right:-3%; width:64%;
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr;
    gap:clamp(10px,1vw,16px); z-index:0;
    transform:translate(0,0); transition:transform .25s ease-out; will-change:transform;
  }
  .cell{ position:relative; border-radius:var(--rt); overflow:hidden; background:#0c1c1a;
    box-shadow:0 22px 50px -28px rgba(0,0,0,.8); animation:breathe var(--bd,9s) ease-in-out infinite; will-change:transform; }
  .cell.t2{ grid-row:span 2; }
  .cell img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.1s ease; }
  .cell img.show{ opacity:1; }
  .cell:nth-child(2n){ --bd:11s; }
  .cell:nth-child(3n){ --bd:10s; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }

  /* Brand-gradient veil sweeping from the left over the wall, so the signup reads cleanly. */
  .veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(90deg, #04110f 26%, rgba(4,17,15,.86) 42%, rgba(4,17,15,.30) 62%, rgba(4,17,15,0) 80%),
      radial-gradient(80% 90% at 30% 50%, rgba(4,17,15,.5) 0%, rgba(4,17,15,0) 60%); }

  .logo{ position:absolute; top:max(18px,2.6vh); left:clamp(24px,5vw,72px); z-index:3; line-height:0; }
  .content{
    position:absolute; z-index:3; left:clamp(24px,5vw,72px); top:50%; transform:translateY(-50%);
    width:min(500px, 86vw); display:flex; flex-direction:column; gap:14px;
  }
  .content .intro.bare h1{ font-size:clamp(38px,5vw,60px); }
  .content .cta{ width:min(460px,100%); margin-top:6px; }

  @media (max-width: 900px){
    .hero{ display:flex; flex-direction:column; }
    /* Signup leads on mobile; the wall sits below it as a bounded band. */
    .content{ position:static; transform:none; order:1; width:auto;
      margin:clamp(78px,12vh,120px) clamp(20px,5vw,32px) 0; }
    .content .intro.bare h1{ font-size:clamp(34px,9vw,46px); }
    .content .cta{ width:100%; }
    .wall{ position:static; order:2; width:auto; right:auto; top:auto; bottom:auto;
      margin:clamp(20px,4vh,32px) clamp(14px,4vw,24px) clamp(16px,3vh,26px);
      grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(78px,11vh); }
    .veil{ background:linear-gradient(0deg, rgba(4,17,15,0) 78%, rgba(4,17,15,.35) 100%); }
  }
  @media (prefers-reduced-motion: reduce){ .cell{ animation:none; } .wall{ transition:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="wall" id="wall" aria-hidden="true">
      <div class="cell t2"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell t2"></div>
      <div class="cell t2"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell t2"></div>
      <div class="cell"></div>
    </div>
    <div class="veil" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo.webm" type="video/webm" />
        <source src="assets/logo.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-fallback.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro bare on-dark">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b style="color:#fff">$1/month for 3 months.</b> What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    // Deck of all tiles, shuffled deterministically; each cell shows one and slowly
    // crossfades to the next over time (no translation — the wall stays put and "lives").
    var TILES = Mosaic.ALL.slice();
    var seed = 23; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var cells = [].slice.call(document.querySelectorAll('.cell'));
    cells.forEach(function(cell, idx){
      // two stacked imgs per cell for a true crossfade
      var a = new Image(), b = new Image();
      a.decoding = b.decoding = 'async'; a.alt = b.alt = '';
      if (idx < 4){ a.loading='eager'; a.fetchPriority='high'; } else { a.loading='lazy'; }
      b.loading = 'lazy';
      a.src = nextTile(); a.className = 'show';
      cell.appendChild(a); cell.appendChild(b);
      var front = a, back = b;
      var period = 4200 + (idx % 5) * 900;        // staggered so cells don't flip in unison
      setTimeout(function(){
        setInterval(function(){
          back.onload = function(){ back.classList.add('show'); front.classList.remove('show');
            var tmp = front; front = back; back = tmp; };
          back.src = nextTile();
        }, period);
      }, 700 + idx * 350);
    });

    // Subtle mouse parallax (desktop, motion allowed): the whole wall drifts a few px.
    var wall = document.getElementById('wall');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (wall && !reduce && matchMedia('(min-width:901px)').matches){
      addEventListener('pointermove', function(e){
        var dx = (e.clientX / innerWidth - 0.5), dy = (e.clientY / innerHeight - 0.5);
        wall.style.transform = 'translate(' + (-dx*22).toFixed(1) + 'px,' + (-dy*16).toFixed(1) + 'px)';
      }, { passive:true });
    }
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
