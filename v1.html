<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V1 — Floating image rows</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V1 — structure referenced from Figma "Hero Floating Image" (257:14605):
     a left content column (heading + subtext + dark CTA pill) and, on the right, a
     "floating image" field built from THREE horizontal rows of rounded photo tiles with
     MIXED widths (wide landscape + narrow portrait). The rows are staggered and bleed off
     the right edge; each row drifts horizontally at its own slow speed (parallax). A white
     fade on the LEFT melts the tiles toward the signup so nothing hard-cuts against it.
     LCP = the heading text. */
  :root{ --rh: clamp(118px, 16.5vh, 168px); --rgap: clamp(8px, 0.9vw, 12px); }
  body{ background:#fff; }
  .hero{ position:relative; width:100%; height:100svh; min-height:620px; max-height:920px;
    overflow:hidden; background:#fff; isolation:isolate; }

  /* Right image field: starts left of centre and bleeds past the right edge. */
  .imgcol{ position:absolute; top:0; bottom:0; right:0; left:44%; overflow:hidden; z-index:1; }
  .rows{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:var(--rgap); }
  .row{ display:flex; gap:var(--rgap); width:max-content; will-change:transform; }
  .row.r0{ animation:driftL var(--d0,64s) linear infinite; }
  .row.r1{ animation:driftL var(--d1,78s) linear infinite; }
  .row.r2{ animation:driftL var(--d2,70s) linear infinite; }
  @keyframes driftL{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .tile{ flex:0 0 auto; height:var(--rh); border-radius:8px; overflow:hidden; background:#eee;
    box-shadow:0 14px 30px -22px rgba(0,0,0,.45); }
  .tile img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* White feathers: a strong LEFT fade toward the signup, plus soft top/bottom edges. */
  .feather{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(90deg, #fff 0%, #fff 6%, rgba(255,255,255,.82) 16%, rgba(255,255,255,0) 34%),
      linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 9%, rgba(255,255,255,0) 91%, rgba(255,255,255,.9) 100%); }

  .logo{ position:absolute; top:max(18px,2.6vh); left:50%; transform:translateX(-50%); z-index:5; line-height:0; }
  .logo .logo-vid{ height:clamp(40px,4.4vw,58px); filter:none; }

  .content{ position:absolute; z-index:4; left:clamp(28px,6vw,90px); top:50%; transform:translateY(-50%);
    width:min(540px, 46vw); display:flex; flex-direction:column; gap:clamp(20px,3vh,34px); }
  .content .intro.bare h1{ font-size:clamp(34px,4.6vw,58px); line-height:1.04; }
  .content .intro.bare p{ font-size:clamp(15px,1.5vw,18px); }
  .content .cta{ width:min(470px,100%); }

  @media (max-width: 900px){
    /* Keep tiles modest so a wide tile doesn't become a slow LCP element. */
    :root{ --rh: clamp(96px, 13vh, 122px); }
    .hero{ display:flex; flex-direction:column; height:100svh; max-height:none; }
    /* Drifting rows fill the top; the signup drops to the bottom, centred.
       position:relative keeps the absolutely-positioned .rows clipped to this column
       (not the whole hero), so they never sit under the heading. */
    .imgcol{ position:relative; order:1; left:auto; flex:1 1 auto; min-height:0;
      margin-top:clamp(58px,8vh,88px); }
    .content{ position:static; transform:none; order:2; width:auto;
      margin:clamp(16px,2.5vh,24px) clamp(22px,6vw,32px) clamp(22px,4vh,34px); gap:16px;
      align-items:center; text-align:center; }
    .content .intro.bare h1{ font-size:clamp(32px,8.5vw,44px); }
    .content .cta{ width:100%; max-width:440px; text-align:left; }
    /* White fades top (under the logo) and bottom (toward the signup). */
    .feather{ background:
      linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 13%, rgba(255,255,255,0) 86%, #fff 100%); }
  }
  @media (prefers-reduced-motion: reduce){ .row{ animation:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="imgcol" aria-hidden="true">
      <div class="rows" id="rows"></div>
      <div class="feather"></div>
    </div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo-dark.webm" type="video/webm" />
        <source src="assets/logo-dark.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-dark.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro bare on-light">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    var TILES = Mosaic.ALL.slice();
    var seed = 17; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var rows = document.getElementById('rows');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Mixed widths echo the Figma's wide (≈1.7) + narrow (≈0.78) tiles, by row height.
    var WIDE = 1.7, NARROW = 0.78;
    var PATTERN = [WIDE, NARROW, WIDE, NARROW, NARROW, WIDE, NARROW, WIDE, NARROW, WIDE];
    var DUR = [64, 78, 70];
    var eager = 0;

    for (var r = 0; r < 3; r++){
      var row = document.createElement('div'); row.className = 'row r' + r;
      row.style.setProperty('--d' + r, DUR[r] + 's');
      if (!reduce) row.style.animationDelay = (-rnd()*DUR[r]).toFixed(1) + 's';
      // Render the tile set TWICE for a seamless -50% marquee loop.
      var set = [];
      for (var n = 0; n < PATTERN.length; n++) set.push({ ar: PATTERN[(n + r*3) % PATTERN.length], src: nextTile() });
      for (var rep = 0; rep < 2; rep++){
        set.forEach(function(s){
          var tile = document.createElement('div'); tile.className = 'tile';
          tile.style.aspectRatio = s.ar + ' / 1';
          var img = new Image(); img.src = s.src; img.alt=''; img.decoding='async';
          if (r === 0 && rep === 0 && eager < 4){ img.loading='eager'; img.fetchPriority='high'; eager++; }
          else img.loading='lazy';
          tile.appendChild(img); row.appendChild(tile);
        });
      }
      rows.appendChild(row);
    }
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
