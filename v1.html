<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V1 — Left signup, mosaic right</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V1: a calm white column on the left holds the whole signup story; the drifting
     merchant mosaic lives in the right two-thirds and fades into the white at its edge.
     LCP element = the heading text on white (no image gates it). */
  body{ background:#fff; }
  .hero{ position:relative; width:100%; height:100svh; min-height:620px; max-height:920px; overflow:hidden; display:flex; }

  .pane-left{
    position:relative; z-index:3; flex:0 0 clamp(380px, 38%, 560px);
    background:#fff; padding:clamp(28px,4vw,64px); display:flex; flex-direction:column;
  }
  .pane-left .logo-vid{ filter:none; height:clamp(40px,4vw,56px); }
  .lead{ margin-top:auto; display:flex; flex-direction:column; gap:18px; max-width:440px; }
  .lead .intro h1{ font-size:clamp(34px,3.6vw,52px); }
  .lead .cta{ width:min(440px,100%); }
  .pane-left .foot{ margin-top:auto; padding-top:26px; }

  .pane-right{ position:relative; flex:1 1 auto; min-width:0; overflow:hidden; background:#c7cdd2; }
  /* soft fade so the mosaic dissolves into the white column (no hard seam) */
  .pane-right .blend{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(90deg, #fff 0%, rgba(255,255,255,0) 16%),
      radial-gradient(120% 140% at 80% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.16) 100%);
  }

  @media (max-width: 860px){
    .hero{ flex-direction:column; height:auto; min-height:100svh; }
    .pane-left{ flex:0 0 auto; order:1; }
    .lead{ margin-top:14px; }
    .pane-left .foot{ margin-top:22px; }
    .pane-right{ order:2; flex:0 0 46svh; min-height:320px; }
    .pane-right .blend{ background:linear-gradient(0deg,rgba(0,0,0,0) 70%,rgba(0,0,0,.12) 100%); }
    :root{ --th: clamp(170px, 40vw, 240px); }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="pane-left">
      <a class="logo" href="#" aria-label="Shopify">
        <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
          <source src="assets/logo.webm" type="video/webm" />
          <source src="assets/logo.mp4" type='video/mp4; codecs="hvc1"' />
          <img src="assets/logo-fallback.png" alt="Shopify" />
        </video>
      </a>

      <div class="lead">
        <section class="intro bare on-light">
          <h1>Your business<br>starts with Shopify</h1>
          <p>Try 3 days free, then <b>$1/month for 3 months.</b> What are you waiting for?</p>
        </section>
        <form class="cta" onsubmit="return false">
          <div class="cta-top">
            <span class="free">Start for free</span>
            <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
          </div>
          <div class="email">
            <input type="email" placeholder="Enter your email" aria-label="Email address" />
            <button type="submit" aria-label="Start free trial">
              <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
      </div>

      <div class="foot">
        <div class="trust on-light"><span class="lbl">Trusted by</span><span class="names">Allbirds · Clek · Leesa · UNTUCKit</span></div>
      </div>
    </div>

    <div class="pane-right">
      <div class="rotor" aria-hidden="true"><div class="track"></div></div>
      <div class="blend" aria-hidden="true"></div>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
    Mosaic.build(document.querySelector('.rotor'), { eagerFirst:3, halfMul:1.35, durBase:84 });
    Mosaic.perfPanel();
  </script>
</body>
</html>
