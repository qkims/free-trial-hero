<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free trial — hero exploration</title>
  <style>
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100vh; overflow:hidden; background:#ececee;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",sans-serif; }
    body{ display:flex; gap:24px; padding:24px; align-items:stretch; }

    /* Left panel */
    .panel{ flex:0 0 300px; align-self:flex-start; display:flex; flex-direction:column; gap:20px;
      padding:20px; background:#fff; border:1px solid #e3e3e6; border-radius:16px;
      box-shadow:0 6px 24px rgba(0,0,0,.06); max-height:calc(100vh - 48px); overflow:auto; }
    .ttl{ font-size:13px; font-weight:600; letter-spacing:-.01em; color:#1a1a1a; }
    .sub{ font-size:11px; color:#8a8a8a; margin-top:-12px; }
    .tabs{ display:flex; flex-direction:column; gap:4px; }
    .tab{ appearance:none; border:0; background:transparent; padding:11px 14px; font:inherit;
      font-size:13px; font-weight:500; color:#616161; border-radius:8px; cursor:pointer; text-align:left;
      transition:background-color .15s, color .15s; }
    .tab:hover{ background:#f1f1f2; color:#1a1a1a; }
    .tab.on{ background:#1a1a1a; color:#fff; }
    .tab small{ display:block; font-weight:400; font-size:11px; opacity:.7; margin-top:2px; }
    .tab.on small{ opacity:.65; }

    .divider{ height:1px; background:#ececee; }
    .mlabel{ font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:#8a8a8a; margin-bottom:-8px; }
    .modes{ display:flex; gap:4px; padding:4px; background:#f1f1f2; border-radius:10px; }
    .mode{ appearance:none; flex:1; border:0; background:transparent; padding:8px 10px; font:inherit;
      font-size:13px; font-weight:500; color:#616161; border-radius:7px; cursor:pointer; transition:.15s; }
    .mode:hover{ color:#1a1a1a; }
    .mode.on{ background:#fff; color:#1a1a1a; box-shadow:0 1px 3px rgba(0,0,0,.12); }

    .note{ font-size:12px; line-height:1.5; color:#4a4a4a; background:#f7f7f8; border-radius:10px; padding:12px 14px; }
    .note b{ color:#1a1a1a; font-weight:600; }
    .foot{ font-size:11px; color:#a0a0a0; line-height:1.5; }
    .foot code{ background:#f1f1f2; padding:1px 5px; border-radius:4px; }

    /* Right stage */
    .stage{ flex:1 1 auto; min-width:0; height:100%; display:flex; }
    .frame{ flex:1 1 auto; width:100%; height:100%; border:0; border-radius:16px; background:#fff;
      box-shadow:0 10px 40px rgba(0,0,0,.12); }
    .stage.mobile{ align-items:center; justify-content:center; overflow:auto; padding:16px 0; }
    .stage.mobile .frame{ flex:0 0 auto; width:390px; max-width:92%; height:844px; max-height:100%;
      border-radius:34px; border:10px solid #111; box-shadow:0 14px 50px rgba(0,0,0,.28); }
  </style>
</head>
<body>
  <aside class="panel">
    <span class="ttl">Free trial · hero exploration</span>
    <span class="sub">Signup-focused layouts · merchant imagery · low LCP</span>

    <nav class="tabs" role="tablist" aria-label="Variant">
      <button class="tab on" data-src="control.html" data-note="<b>Control.</b> The current build: a centered intro + CTA card floating over the full-bleed, +18°-tilted drifting merchant mosaic. Signup sits dead-center over a legibility scrim.">
        Control <small>Centered card · full mosaic</small>
      </button>
      <button class="tab" data-src="v1.html" data-note="<b>V1 · Left signup.</b> A calm white column owns the signup, now with the real dark Shopify logo (green bag + black wordmark). The mosaic on the right is STRAIGHT-aligned (no tilt) with smaller, fully-contained tiles, so the wall sits neatly framed instead of bleeding off the edges.">
        V1 · Left signup <small>Straight grid · contained tiles</small>
      </button>
      <button class="tab" data-src="v2.html" data-note="<b>V2 · Center calm.</b> Reworked to differ from Control: the wall is now VERTICAL columns drifting up/down (adjacent columns opposite ways) with SMALLER tiles, so more merchant photos show at better quality. Signup stays centered over a soft feathered pool.">
        V2 · Center calm <small>Vertical columns · smaller tiles</small>
      </button>
      <button class="tab" data-src="v3.html" data-note="<b>V3 · Right + story.</b> The left is now FULLY populated — vertical columns of merchant photos scroll continuously (opposite directions), always full and always revealing more of the deck. Signup sits in a clean right column with the real dark logo.">
        V3 · Right + story <small>Form right · scrolling columns</small>
      </button>
      <button class="tab" data-src="v4.html" data-note="<b>V4 · Living mood wall.</b> No sliding. A fully-packed wall of merchant tiles (no gaps) where each photo MORPHS to the next with a zoom-dissolve. Hover gives a snappy 3D parallax tilt. No more breathing/touching. Brand-gradient veil keeps the signup crisp — and it's still the lightest LCP.">
        V4 · Mood wall <small>Packed · morph · 3D tilt</small>
      </button>
      <button class="tab" data-src="v5.html" data-note="<b>V5 · Shopify world.</b> A calm WHITE hero with the signup centred, and a layered scatter of upright merchant cards on three DEPTH tiers — back cards smaller, blurred and dim; front cards larger and sharp. Each card is a seamless vertical strip whose photos SLIDE UP and loop forever; back tiers scroll slower than front for parallax. Extra cards top & bottom build a fuller 3D field. (Trust logos omitted per the earlier 'remove trusted-by' note.)">
        V5 · Shopify world <small>White · looping slide-up + depth</small>
      </button>
    </nav>

    <div class="divider"></div>
    <span class="mlabel">Viewport</span>
    <div class="modes" role="group" aria-label="Viewport">
      <button class="mode on" data-mode="desktop" aria-pressed="true">Desktop</button>
      <button class="mode" data-mode="mobile" aria-pressed="false">Mobile</button>
    </div>

    <div class="note" id="note"></div>
    <div class="foot">Press <code>p</code> inside a preview to toggle its live LCP readout.</div>
  </aside>

  <main class="stage">
    <iframe class="frame" title="Variant preview"></iframe>
  </main>

  <script>
    const frame = document.querySelector('.frame');
    const stage = document.querySelector('.stage');
    const note  = document.getElementById('note');
    const tabs  = [...document.querySelectorAll('.tab')];
    const modes = [...document.querySelectorAll('.mode')];
    let mode = 'desktop';
    let active = tabs.find(t => t.classList.contains('on')) || tabs[0];

    const bust = src => src + (src.includes('?') ? '&' : '?') + 't=' + Date.now();
    function load(){
      stage.classList.toggle('mobile', mode === 'mobile');
      frame.src = bust(active.dataset.src);
      note.innerHTML = active.dataset.note || '';
    }
    load();

    tabs.forEach(tab => tab.addEventListener('click', () => {
      active = tab;
      tabs.forEach(t => { const on = t === tab; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
      load();
    }));
    modes.forEach(btn => btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      modes.forEach(m => { const on = m === btn; m.classList.toggle('on', on); m.setAttribute('aria-pressed', on); });
      load();
    }));
  </script>
</body>
</html>
