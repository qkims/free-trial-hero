<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control — centered card over drifting mosaic</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* Control: full-bleed tilted drifting mosaic, centered intro+CTA over a legibility scrim. */
  body{ background:var(--ink); }
  .hero{
    position:relative; width:100%; aspect-ratio:1440/810; max-height:100svh;
    overflow:hidden; background:#c7cdd2; isolation:isolate;
  }
  .scrim{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(75% 70% at 50% 50%, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(140% 120% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.30) 100%),
      linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.30));
  }
  .logo{ position:absolute; top:max(12px,1.8vh); left:50%; transform:translateX(-50%); z-index:3; line-height:0; }
  .content{
    position:absolute; z-index:3; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(460px, 86vw); display:flex; flex-direction:column; gap:10px;
  }
  @media (max-width: 900px){
    .hero{ aspect-ratio:auto; height:100svh; min-height:600px; }
    :root{ --th: clamp(200px, 46vw, 310px); }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="rotor" aria-hidden="true"><div class="track"></div></div>
    <div class="scrim" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo.webm" type="video/webm" />
        <source src="assets/logo.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-fallback.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
    Mosaic.build(document.querySelector('.rotor'), { eagerFirst:4, halfMul:1.3 });
    Mosaic.perfPanel();
  </script>
</body>
</html>
