<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V3 — Right signup, story collage left</title>
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V3: instead of an endless marquee, a curated, slowly-floating collage of real merchant
     photos tells a "your store, your customers, your craft" story on the left; the signup
     sits in a clean column on the right. Heading text is the LCP element. */
  :root{ --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif; --radius-tile:18px; }
  body{ background:#f4f3f1; }
  .hero{ position:relative; width:100%; height:100svh; min-height:640px; max-height:940px; overflow:hidden; display:flex; }

  /* Left: floating collage */
  .story{ position:relative; flex:1 1 auto; min-width:0; padding:clamp(20px,3vw,46px); overflow:hidden; }
  .collage{
    position:absolute; inset:clamp(20px,3vw,46px);
    display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr;
    gap:clamp(12px,1.6vw,22px);
  }
  .ph{ position:relative; border-radius:var(--radius-tile); overflow:hidden; background:#e7e3dc; box-shadow:0 12px 30px -18px rgba(0,0,0,.45); }
  .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ph.tall{ grid-row:span 2; }
  /* gentle, independent float so the collage feels alive but calm */
  .ph{ animation:float var(--fd,11s) ease-in-out infinite; will-change:transform; }
  .ph:nth-child(2){ --fd:13s; animation-delay:-3s; }
  .ph:nth-child(3){ --fd:12s; animation-delay:-6s; }
  .ph:nth-child(4){ --fd:14s; animation-delay:-2s; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @media (prefers-reduced-motion: reduce){ .ph{ animation:none; } }

  /* Right: signup column */
  .panel{
    position:relative; z-index:3; flex:0 0 clamp(380px, 36%, 520px);
    background:#fff; padding:clamp(28px,4vw,60px);
    display:flex; flex-direction:column; box-shadow:-20px 0 50px -30px rgba(0,0,0,.25);
  }
  .panel .logo-vid{ filter:none; height:clamp(40px,4vw,54px); }
  .panel .lead{ margin:auto 0; display:flex; flex-direction:column; gap:18px; }
  .panel .intro h1{ font-size:clamp(32px,3.4vw,48px); }
  .panel .trust{ margin-top:26px; }

  @media (max-width: 900px){
    .hero{ flex-direction:column; height:auto; min-height:100svh; }
    .panel{ order:1; flex:0 0 auto; box-shadow:none; }
    .panel .lead{ margin:14px 0 0; }
    .story{ order:2; flex:0 0 44svh; min-height:300px; }
    .collage{ position:absolute; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="story">
      <div class="collage" aria-hidden="true">
        <div class="ph tall"><img src="assets/tile-08.webp" alt="" decoding="async" fetchpriority="high"></div>
        <div class="ph"><img src="assets/tile-19.webp" alt="" loading="lazy" decoding="async"></div>
        <div class="ph"><img src="assets/tile-24.webp" alt="" loading="lazy" decoding="async"></div>
        <div class="ph tall"><img src="assets/tile-11.webp" alt="" loading="lazy" decoding="async"></div>
      </div>
    </div>

    <aside class="panel">
      <a class="logo" href="#" aria-label="Shopify">
        <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
          <source src="assets/logo.webm" type="video/webm" />
          <source src="assets/logo.mp4" type='video/mp4; codecs="hvc1"' />
          <img src="assets/logo-fallback.png" alt="Shopify" />
        </video>
      </a>
      <div class="lead">
        <section class="intro bare on-light">
          <h1>Your business<br>starts with Shopify</h1>
          <p>Try 3 days free, then <b>$1/month for 3 months.</b> What are you waiting for?</p>
        </section>
        <form class="cta" onsubmit="return false">
          <div class="cta-top">
            <span class="free">Start for free</span>
            <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
          </div>
          <div class="email">
            <input type="email" placeholder="Enter your email" aria-label="Email address" />
            <button type="submit" aria-label="Start free trial">
              <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
        <div class="trust on-light"><span class="lbl">Trusted by</span><span class="names">Allbirds · Clek · Leesa · UNTUCKit</span></div>
      </div>
    </aside>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
    Mosaic.perfPanel();
  </script>
</body>
</html>
