<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V3 — Bento cluster</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V3 — structure referenced from Figma (307:20103): a left content column (heading +
     subtext + dark CTA pill) and, on the right, a BENTO cluster of merchant photos. Each
     bento block is a clipped viewport whose vertical strip of photos scrolls continuously
     (adjacent blocks opposite directions), so the imagery is always alive. LCP = heading. */
  :root{ --bg:#f4f5f7; }
  body{ background:#fff; }
  .hero{ position:relative; width:100%; height:100svh; min-height:640px; max-height:920px;
    overflow:hidden; background:#fff; isolation:isolate; }

  .stage{ position:absolute; top:50%; right:clamp(20px,3.4vw,46px); left:46%; transform:translateY(-50%);
    height:min(560px, 80vh); z-index:1; }
  /* A tidy 3×2 bento of image BLOCKS; the centre column is two stacked blocks (not one
     long image). Each block is a clipped viewport with a vertical strip of photos that
     scrolls continuously (like Center calm), neighbours going opposite directions. */
  .bento{ display:grid; height:100%; gap:clamp(10px,1vw,16px);
    grid-template-columns:1.05fr 1fr 1fr; grid-template-rows:1fr 1fr; }

  .cell{ position:relative; border-radius:16px; overflow:hidden; background:var(--bg);
    box-shadow:0 26px 50px -34px rgba(0,0,0,.4); }
  .cell .strip{ position:absolute; left:0; top:0; width:100%; height:calc(var(--n,8) * 100%);
    display:flex; flex-direction:column; will-change:transform;
    animation:scrollY var(--sd,30s) linear infinite; }
  .cell .strip.down{ animation-direction:reverse; }
  .cell .strip img{ width:100%; height:calc(100% / var(--n,8)); object-fit:cover; display:block; }
  @keyframes scrollY{ from{ transform:translateY(0); } to{ transform:translateY(-50%); } }

  .logo{ position:absolute; top:max(18px,2.6vh); left:50%; transform:translateX(-50%); z-index:5; line-height:0; }
  .logo .logo-vid{ height:clamp(40px,4.4vw,58px); filter:none; }

  .content{ position:absolute; z-index:4; left:clamp(28px,6vw,90px); top:50%; transform:translateY(-50%);
    width:min(520px, 42vw); display:flex; flex-direction:column; gap:clamp(20px,3vh,34px); }
  .content .intro.bare h1{ font-size:clamp(34px,4.4vw,56px); line-height:1.04; }
  .content .intro.bare p{ font-size:clamp(15px,1.5vw,18px); }
  .content .cta{ width:min(460px,100%); }

  @media (max-width: 900px){
    .hero{ display:flex; flex-direction:column; height:100svh; max-height:none; }
    /* Images fill the top; the signup drops to the bottom, centred. */
    .stage{ position:static; transform:none; order:1; left:auto; right:auto;
      flex:1 1 auto; min-height:0; margin:clamp(62px,9vh,94px) clamp(14px,4vw,22px) 0; }
    .bento{ grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); }
    .content{ position:static; transform:none; order:2; width:auto;
      margin:clamp(18px,3vh,26px) clamp(20px,6vw,32px) clamp(22px,4vh,34px);
      gap:16px; align-items:center; text-align:center; }
    .content .intro.bare h1{ font-size:clamp(32px,8.5vw,44px); }
    .content .cta{ width:100%; max-width:440px; text-align:left; }
  }
  @media (prefers-reduced-motion: reduce){ .cell .strip{ animation:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="stage" aria-hidden="true">
      <div class="bento" id="bento">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo-dark.webm" type="video/webm" />
        <source src="assets/logo-dark.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-dark.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro bare on-light">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    var TILES = Mosaic.ALL.slice();
    var seed = 41; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Each bento block gets a vertical strip of photos that scrolls and loops. The strip
    // holds `count` photos rendered twice (height = 2·count blocks); translateY 0 → -50%
    // advances exactly `count` photos and wraps seamlessly. Neighbours alternate direction.
    var cells = document.querySelectorAll('#bento .cell');
    var DIR = [-1, 1, -1, 1, -1, 1];        // up / down per block (index order)
    var DUR = [30, 26, 34, 28, 33, 27];
    var COUNT = 4, eager = 0;
    cells.forEach(function(cell, ci){
      var n = COUNT * 2; cell.style.setProperty('--n', n);
      var strip = document.createElement('div');
      strip.className = 'strip' + (DIR[ci] < 0 ? '' : ' down');
      if (reduce){ strip.style.animation = 'none'; }
      else {
        strip.style.setProperty('--sd', DUR[ci] + 's');
        strip.style.animationDelay = (-rnd() * DUR[ci]).toFixed(1) + 's';
      }
      var picks = []; for (var i = 0; i < COUNT; i++) picks.push(nextTile());
      for (var rep = 0; rep < 2; rep++){
        for (var j = 0; j < COUNT; j++){
          var img = new Image(); img.src = picks[j]; img.alt = ''; img.decoding = 'async';
          if (rep === 0 && j === 0 && eager < 4){ img.loading='eager'; img.fetchPriority='high'; eager++; }
          else img.loading = 'lazy';
          strip.appendChild(img);
        }
      }
      cell.appendChild(strip);
    });
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
