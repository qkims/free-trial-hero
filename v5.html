<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V5 — Shopify world</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V5 (depth world): a calm WHITE hero, signup centred, and a layered scatter of upright
     merchant cards on three DEPTH layers — back smaller/blurred/dim, front larger/sharp.
     The CARDS themselves drift UP the page and seamlessly loop (a card leaving the top
     re-enters from the bottom). Each depth layer scrolls at its own speed for parallax:
     back slow, front faster. LCP = heading / first front card. */
  :root{ --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif; }
  body{ background:#fff; }
  .hero{ position:relative; width:100%; height:100svh; min-height:640px; max-height:940px;
    overflow:hidden; background:
      radial-gradient(120% 90% at 80% 18%, #f3f6fb 0%, rgba(243,246,251,0) 60%),
      radial-gradient(120% 100% at 12% 86%, #f1f7f3 0%, rgba(241,247,243,0) 55%),
      #ffffff;
    isolation:isolate; }

  .field{ position:absolute; inset:0; z-index:1; }
  .layer{ position:absolute; inset:0; }
  /* Shallower depth: just two tiers now — a soft back and a sharp front. */
  .layer.d1{ z-index:2; filter:blur(1px); opacity:.94; }
  .layer.d2{ z-index:3; }

  /* Each layer's cards live in a stack twice the viewport tall; translateY 0 -> -50%
     scrolls everything up by one viewport and loops seamlessly (the halves are identical). */
  .stack{ position:absolute; left:0; top:0; width:100%;
    animation:slideUp var(--dur,40s) linear infinite; will-change:transform; }
  @keyframes slideUp{ from{ transform:translateY(0); } to{ transform:translateY(-50%); } }

  .card{ position:absolute; border-radius:0; overflow:hidden; background:#efece7;
    box-shadow:0 22px 50px -26px rgba(0,0,0,.34); }
  .layer.d2 .card{ box-shadow:0 32px 66px -28px rgba(0,0,0,.42), 0 8px 18px rgba(0,0,0,.10); }
  /* Two stacked photo layers per card so it can crossfade to a new image while it travels. */
  .card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity 1.1s ease; }
  .card img.show{ opacity:1; }

  /* Feathered white pool behind the signup: a bright, near-opaque core that melts outward
     through several soft stops to fully transparent, so the signup lifts off the card field
     without any hard edge. Two stacked radials — a wider gentle feather + a tighter glow. */
  .halo{ position:absolute; z-index:2; top:44%; left:50%; transform:translate(-50%,-50%);
    width:min(900px,104vw); height:min(640px,88vh); pointer-events:none;
    background:
      radial-gradient(52% 52% at 50% 50%,
        rgba(255,255,255,.98) 0%, rgba(255,255,255,.97) 30%, rgba(255,255,255,.82) 50%,
        rgba(255,255,255,.45) 66%, rgba(255,255,255,.16) 80%, rgba(255,255,255,0) 92%),
      radial-gradient(34% 40% at 50% 48%,
        rgba(255,255,255,1) 0%, rgba(255,255,255,.9) 55%, rgba(255,255,255,0) 100%); }

  .logo{ position:absolute; top:max(16px,2.4vh); left:50%; transform:translateX(-50%); z-index:5; line-height:0; }
  .logo .logo-vid{ height:clamp(36px,3.6vw,50px); filter:none; }

  .content{ position:absolute; z-index:4; top:44%; left:50%; transform:translate(-50%,-50%);
    width:min(470px,88vw); display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center; }
  .content .intro{ width:100%; }
  .content .intro h1{ font-size:clamp(32px,4.2vw,46px); }
  .content .cta{ width:100%; text-align:left; }

  @media (max-width: 900px){
    .hero{ min-height:100svh; }
    /* Signup drops to the bottom; the feathered pool follows it down. */
    .content{ top:auto; bottom:clamp(26px,5vh,46px); transform:translateX(-50%); }
    .content .intro h1{ font-size:clamp(30px,8vw,42px); }
    .halo{ top:auto; bottom:0; transform:translateX(-50%);
      width:172vw; height:64vh;
      background:
        radial-gradient(62% 58% at 50% 80%,
          rgba(255,255,255,.99) 0%, rgba(255,255,255,.97) 34%, rgba(255,255,255,.8) 54%,
          rgba(255,255,255,.4) 70%, rgba(255,255,255,.13) 86%, rgba(255,255,255,0) 97%),
        radial-gradient(40% 34% at 50% 86%,
          rgba(255,255,255,1) 0%, rgba(255,255,255,.9) 55%, rgba(255,255,255,0) 100%); }
  }
  @media (prefers-reduced-motion: reduce){ .stack{ animation:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="field" id="field" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo-dark.webm" type="video/webm" />
        <source src="assets/logo-dark.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-dark.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    var TILES = Mosaic.ALL.slice();
    var seed = 29; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var field = document.getElementById('field');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W = field.clientWidth || 1280, H = field.clientHeight || 800;
    var u = Math.max(0.62, W / 1440);

    // Three depth layers. Each card carries its own size + aspect, so the field mixes
    // portrait / square / landscape tiles instead of one uniform shape (ar = height/width).
    // x = centre fraction of W, y = centre fraction of one loop (= viewport height). Cards are
    // spread wide across the field, including past the edges, so nothing clusters.
    // `swap:true` cards crossfade to a fresh photo periodically while they travel.
    // Two tiers only (shallower depth) and a leaner card count so desktop doesn't crowd.
    // Front cards are scaled up and pushed toward the edges, leaving the centre clear.
    var TIERS = [
      { d:1, scale:0.90, dur:35, cards:[          // back — soft, slow
        {x:.30,y:.15,w:176,ar:1.30, swap:true}, {x:.68,y:.27,w:160,ar:0.82},
        {x:.02,y:.58,w:184,ar:1.0},  {x:.90,y:.66,w:170,ar:1.28, swap:true},
        {x:.54,y:.92,w:164,ar:1.0} ]},
      { d:2, scale:1.14, dur:27, cards:[          // front — sharp, faster, larger
        {x:.12,y:.30,w:232,ar:1.30, swap:true}, {x:.84,y:.10,w:246,ar:1.0, swap:true},
        {x:.72,y:.82,w:234,ar:0.80, swap:true},  {x:.22,y:.66,w:220,ar:1.24, swap:true},
        {x:.97,y:.44,w:214,ar:1.0} ]}
    ];

    var eager = 0, swapGroups = [], swapIdx = 0;
    TIERS.forEach(function(tier){
      var layer = document.createElement('div'); layer.className = 'layer d' + tier.d;
      var stack = document.createElement('div'); stack.className = 'stack';
      stack.style.height = (2 * H).toFixed(0) + 'px';
      if (!reduce){ stack.style.setProperty('--dur', tier.dur + 's'); stack.style.animationDelay = (-rnd()*tier.dur).toFixed(1) + 's'; }
      else { stack.style.animation = 'none'; }

      tier.cards.forEach(function(c){ c._tile = nextTile(); });   // fixed per card so both halves match

      tier.cards.forEach(function(c){
        var w = c.w * u, h = w * c.ar;
        var copies = [];                          // both loop-copies of this card, swapped together
        for (var rep = 0; rep < 2; rep++){
          var card = document.createElement('div'); card.className = 'card';
          card.style.width = w.toFixed(1) + 'px'; card.style.height = h.toFixed(1) + 'px';
          card.style.left = (W*c.x - w/2).toFixed(1) + 'px';
          card.style.top  = (c.y*H + rep*H - h/2).toFixed(1) + 'px';
          card.style.transform = 'scale(' + tier.scale + ')';
          var a = new Image(), b = new Image();
          a.alt = b.alt = ''; a.decoding = b.decoding = 'async';
          a.className = 'show'; a.src = c._tile; b.loading = 'lazy';
          if (tier.d === 2 && rep === 0 && eager < 3){ a.loading='eager'; a.fetchPriority='high'; eager++; }
          else { a.loading = 'lazy'; }
          card.appendChild(a); card.appendChild(b); stack.appendChild(card);
          copies.push({ a:a, b:b, front:a });
        }
        if (c.swap && !reduce) swapGroups.push(copies);
      });
      layer.appendChild(stack); field.appendChild(layer);
    });

    // Crossfade a card's photo to a new one — applied to BOTH loop-copies at once so the
    // seamless loop never reveals a mismatch. Cards take turns, staggered, on a calm cadence.
    function swap(copies){
      var src = nextTile();
      copies.forEach(function(cp){
        var back = (cp.front === cp.a) ? cp.b : cp.a;
        back.onload = function(){ back.classList.add('show'); cp.front.classList.remove('show'); cp.front = back; };
        back.src = src;
      });
    }
    if (swapGroups.length){
      setInterval(function(){
        swap(swapGroups[swapIdx % swapGroups.length]);
        swapIdx++;
      }, 2600);   // one card refreshes every ~2.6s, round-robin
    }
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
