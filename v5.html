<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V5 — Wave of cards</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V5 (wave): a calm WHITE hero with the signup centred, and a loose scatter of upright
     rounded merchant photo cards around it. On each cycle a new photo SLIDES UP from the
     bottom of every card, staggered left-to-right so it ripples like a wave; the batch then
     HOLDS for ~1.4s before the next batch slides up. LCP = the heading text / first card. */
  :root{ --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif; }
  body{ background:#fff; }
  .hero{ position:relative; width:100%; height:100svh; min-height:640px; max-height:940px;
    overflow:hidden; background:#fff; isolation:isolate; }

  /* Layer of cards (behind the signup). Cards are upright; their photos slide vertically. */
  .field{ position:absolute; inset:0; z-index:1; }
  .fcard{ position:absolute; border-radius:18px; overflow:hidden; background:#efece7;
    box-shadow:0 26px 56px -28px rgba(0,0,0,.38), 0 6px 16px rgba(0,0,0,.08); }
  .fcard img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .85s cubic-bezier(.4,0,.2,1); will-change:transform; backface-visibility:hidden; }

  /* Soft white halo so the centred signup always reads cleanly over the cards. */
  .halo{ position:absolute; z-index:2; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(820px,98vw); height:min(580px,82vh); pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(255,255,255,.96) 0%, rgba(255,255,255,.86) 42%, rgba(255,255,255,0) 72%); }

  .logo{ position:absolute; top:max(16px,2.4vh); left:50%; transform:translateX(-50%); z-index:5; line-height:0; }
  .logo .logo-vid{ height:clamp(36px,3.6vw,50px); filter:none; }   /* dark logo, no shadow on white */

  .content{ position:absolute; z-index:4; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(470px,88vw); display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center; }
  .content .intro{ width:100%; }
  .content .intro h1{ font-size:clamp(32px,4.2vw,46px); }
  .content .cta{ width:100%; text-align:left; }

  @media (max-width: 900px){
    .hero{ min-height:100svh; }
    .field .fcard:nth-child(n+6){ display:none; }
    .halo{ width:130vw; height:64vh;
      background:radial-gradient(50% 50% at 50% 50%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.9) 46%, rgba(255,255,255,0) 74%); }
    .content .intro h1{ font-size:clamp(30px,8vw,42px); }
  }
  @media (prefers-reduced-motion: reduce){ .fcard img{ transition:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="field" id="field" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo-dark.webm" type="video/webm" />
        <source src="assets/logo-dark.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-dark.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    var TILES = Mosaic.ALL.slice();
    var seed = 29; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var field = document.getElementById('field');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W = field.clientWidth || 1280, H = field.clientHeight || 800;
    var u = Math.max(0.62, W / 1440);     // scale card sizes with viewport (floor so mobile isn't tiny)

    // Card centres as fractions of the hero, ringed loosely around the centred signup. Upright.
    var SPECS = [
      {x:.15,y:.21,w:210,h:270},
      {x:.62,y:.16,w:200,h:248},
      {x:.07,y:.52,w:198,h:250},
      {x:.81,y:.33,w:212,h:286},
      {x:.20,y:.79,w:190,h:228},
      {x:.64,y:.77,w:214,h:250},
      {x:.42,y:.085,w:178,h:212},
      {x:.91,y:.61,w:168,h:208}
    ];

    var cards = [];
    SPECS.forEach(function(s, idx){
      var w = s.w * u, h = s.h * u;
      var card = document.createElement('div'); card.className = 'fcard';
      card.style.width = w.toFixed(1) + 'px'; card.style.height = h.toFixed(1) + 'px';
      card.style.left = (W*s.x - w/2).toFixed(1) + 'px';
      card.style.top  = (H*s.y - h/2).toFixed(1) + 'px';

      // Two stacked images: the visible one (cur, at 0) and a spare waiting below (at 100%).
      var cur = new Image(), spare = new Image();
      cur.decoding = spare.decoding = 'async'; cur.alt = spare.alt = '';
      if (idx < 4){ cur.loading='eager'; cur.fetchPriority='high'; } else { cur.loading='lazy'; }
      spare.loading = 'lazy';
      cur.src = nextTile(); cur.style.transform = 'translateY(0)';
      spare.style.transform = 'translateY(100%)';
      card.appendChild(cur); card.appendChild(spare);
      field.appendChild(card);

      card._cur = cur; card._spare = spare; card._x = s.x;
      cards.push(card);
    });

    // Slide a new photo up from the bottom of one card (old photo exits out the top).
    function slideNext(card){
      var nxt = card._spare, old = card._cur;
      nxt.onload = function(){
        nxt.style.transform = 'translateY(0)';        // rises into view from below
        old.style.transform = 'translateY(-100%)';    // current exits out the top
      };
      nxt.src = nextTile();
      // After the slide, recycle the old image to the bottom (instantly) as the next spare.
      setTimeout(function(){
        old.style.transition = 'none';
        old.style.transform = 'translateY(100%)';
        void old.offsetHeight;                         // flush, then restore the transition
        old.style.transition = '';
        card._cur = nxt; card._spare = old;
      }, 900);
    }

    if (!reduce){
      // Wave: stagger the slide left-to-right so the batch ripples; then hold; then repeat.
      var order = cards.map(function(_,i){ return i; }).sort(function(p,q){ return cards[p]._x - cards[q]._x; });
      var STAGGER = 130, SLIDE = 850, HOLD = 1400;
      var timer;
      function wave(){
        order.forEach(function(ci, k){ setTimeout(function(){ slideNext(cards[ci]); }, k * STAGGER); });
        var total = (order.length - 1) * STAGGER + SLIDE + HOLD;
        timer = setTimeout(wave, total);
      }
      timer = setTimeout(wave, 700);   // first wave shortly after load
    }
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
