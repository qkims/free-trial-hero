<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V5 — Shopify world</title>
<link rel="stylesheet" href="lib/mosaic.css" />
<link rel="stylesheet" href="lib/ui.css" />
<style>
  /* V5 (depth world): a calm WHITE hero, signup centred, and a layered scatter of upright
     merchant cards on three DEPTH tiers — back cards smaller, blurred and dim; front cards
     larger and sharp. Each card is a seamless vertical strip whose photos SLIDE UP and loop
     forever; back tiers scroll slower than front for parallax. Extra cards top & bottom build
     a fuller 3D field. LCP = heading / first visible slide. */
  :root{ --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Arial,sans-serif; }
  body{ background:#fff; }
  .hero{ position:relative; width:100%; height:100svh; min-height:640px; max-height:940px;
    overflow:hidden; background:
      radial-gradient(120% 90% at 80% 18%, #f3f6fb 0%, rgba(243,246,251,0) 60%),
      radial-gradient(120% 100% at 12% 86%, #f1f7f3 0%, rgba(241,247,243,0) 55%),
      #ffffff;
    isolation:isolate; }

  .field{ position:absolute; inset:0; z-index:1; }
  .fcard{ position:absolute; border-radius:18px; overflow:hidden; will-change:transform; }
  .fcard.d0{ filter:blur(5px) saturate(.92) brightness(1.03); opacity:.7;  z-index:1;
    box-shadow:0 16px 38px -26px rgba(0,0,0,.30); }
  .fcard.d1{ filter:blur(1.6px); opacity:.92; z-index:2;
    box-shadow:0 22px 50px -26px rgba(0,0,0,.34); }
  .fcard.d2{ filter:none; opacity:1; z-index:3;
    box-shadow:0 32px 66px -28px rgba(0,0,0,.42), 0 8px 18px rgba(0,0,0,.10); }

  /* Seamless upward-scrolling strip: two identical halves, translateY 0 -> -50% loops. */
  .strip{ position:absolute; left:0; top:0; width:100%; display:flex; flex-direction:column;
    animation:slideUp var(--dur,18s) linear infinite; will-change:transform; }
  .strip .slide{ width:100%; flex:0 0 auto; }
  .strip img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes slideUp{ from{ transform:translateY(0); } to{ transform:translateY(-50%); } }

  .halo{ position:absolute; z-index:2; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(820px,98vw); height:min(580px,82vh); pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(255,255,255,.95) 0%, rgba(255,255,255,.84) 42%, rgba(255,255,255,0) 72%); }

  .logo{ position:absolute; top:max(16px,2.4vh); left:50%; transform:translateX(-50%); z-index:5; line-height:0; }
  .logo .logo-vid{ height:clamp(36px,3.6vw,50px); filter:none; }

  .content{ position:absolute; z-index:4; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(470px,88vw); display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center; }
  .content .intro{ width:100%; }
  .content .intro h1{ font-size:clamp(32px,4.2vw,46px); }
  .content .cta{ width:100%; text-align:left; }

  @media (max-width: 900px){
    .hero{ min-height:100svh; }
    .field .fcard:nth-child(n+6){ display:none; }
    .halo{ width:130vw; height:64vh;
      background:radial-gradient(50% 50% at 50% 50%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.9) 46%, rgba(255,255,255,0) 74%); }
    .content .intro h1{ font-size:clamp(30px,8vw,42px); }
  }
  @media (prefers-reduced-motion: reduce){ .strip{ animation:none; } }
</style>
</head>
<body>
  <main class="hero">
    <div class="field" id="field" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>

    <a class="logo" href="#" aria-label="Shopify">
      <video class="logo-vid" autoplay muted playsinline disablepictureinpicture width="850" height="300" aria-hidden="true">
        <source src="assets/logo-dark.webm" type="video/webm" />
        <source src="assets/logo-dark.mp4" type='video/mp4; codecs="hvc1"' />
        <img src="assets/logo-dark.png" alt="Shopify" />
      </video>
    </a>

    <div class="content">
      <section class="intro">
        <h1>Your business<br>starts with Shopify</h1>
        <p>Try 3 days free, then <b>$1/month for 3 months.</b><br>What are you waiting for?</p>
      </section>
      <form class="cta" onsubmit="return false">
        <div class="cta-top">
          <span class="free">Start for free</span>
          <span class="disclaimer">You agree to receive Shopify marketing emails.</span>
        </div>
        <div class="email">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button type="submit" aria-label="Start free trial">
            <svg viewBox="0 0 17 16" fill="none"><path d="M1 8h14M9 2l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="perf">LCP: measuring…</div>
  <script src="lib/mosaic.js"></script>
  <script>
  (function(){
    var TILES = Mosaic.ALL.slice();
    var seed = 29; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for (var i=TILES.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)); var t=TILES[i];TILES[i]=TILES[k];TILES[k]=t; }
    var di = 0; function nextTile(){ var t = TILES[di % TILES.length]; di++; return 'assets/' + t; }

    var field = document.getElementById('field');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W = field.clientWidth || 1280, H = field.clientHeight || 800;
    var u = Math.max(0.62, W / 1440);

    // Card centres + depth tier d (0=back blur, 1=mid, 2=front). Extra layers top & bottom.
    var SPECS = [
      {x:.15,y:.21,w:210,h:270,d:1},
      {x:.62,y:.16,w:200,h:248,d:0},
      {x:.07,y:.52,w:198,h:250,d:2},
      {x:.81,y:.33,w:212,h:286,d:0},
      {x:.20,y:.79,w:190,h:228,d:2},
      {x:.64,y:.77,w:214,h:250,d:1},
      {x:.42,y:.10,w:178,h:212,d:0},
      {x:.91,y:.61,w:168,h:208,d:2},
      {x:.30,y:.94,w:165,h:200,d:1},   // bottom layer
      {x:.52,y:.04,w:160,h:195,d:0},   // top layer (far back)
      {x:.10,y:.91,w:150,h:182,d:0},   // bottom-left far back
      {x:.88,y:.89,w:158,h:188,d:1}    // bottom-right
    ];
    var SCALE   = [0.8, 0.92, 1.04];   // by depth tier
    var PERSLIDE= [5.4, 4.2, 3.2];     // seconds per photo: back scrolls slower (parallax)
    var K = 5;                         // distinct photos per loop half

    SPECS.forEach(function(s, idx){
      var w = s.w * u, h = s.h * u;
      var card = document.createElement('div'); card.className = 'fcard d' + s.d;
      card.style.width = w.toFixed(1) + 'px'; card.style.height = h.toFixed(1) + 'px';
      card.style.left = (W*s.x - w/2).toFixed(1) + 'px';
      card.style.top  = (H*s.y - h/2).toFixed(1) + 'px';
      card.style.transform = 'scale(' + SCALE[s.d] + ')';

      var strip = document.createElement('div'); strip.className = 'strip';
      strip.style.setProperty('--dur', (PERSLIDE[s.d] * K).toFixed(1) + 's');
      if (!reduce) strip.style.animationDelay = (-rnd() * PERSLIDE[s.d] * K).toFixed(1) + 's';
      else strip.style.animation = 'none';

      // One loop half = K distinct photos; render it twice for a seamless -50% loop.
      var half = []; for (var j=0;j<K;j++) half.push(nextTile());
      for (var rep=0; rep<2; rep++){
        for (var j2=0;j2<K;j2++){
          var slide = document.createElement('div'); slide.className = 'slide';
          slide.style.height = h.toFixed(1) + 'px';
          var img = new Image(); img.src = half[j2]; img.alt=''; img.decoding='async';
          img.loading = (idx < 3 && rep===0 && j2===0) ? 'eager' : 'lazy';
          if (idx < 3 && rep===0 && j2===0) img.fetchPriority = 'high';
          slide.appendChild(img); strip.appendChild(slide);
        }
      }
      card.appendChild(strip);
      field.appendChild(card);
    });
    Mosaic.perfPanel();
  })();
  </script>
</body>
</html>
